xt:`our worst result — published`}]},or=[{tone:`s-bad`,value:`0%`,label:`of modern neural TTS caught by our own voice ensemble — measured, not projected`},{tone:`s-good`,value:`36/36`,label:`adversarial TrustLine tests passing — replay, brute force, campaign detection`},{tone:`s-pur`,value:`₹22,495cr`,label:`lost in India to caller-impersonation "digital arrest" scams during 2025`},{tone:``,value:`2`,label:`directions of trust verified — the applicant coming in, the institution going out`}],sr={cards:[{tone:`t-good`,value:`80%`,title:`Real speech, correctly approved`,note:`20 samples, FoR dataset. One in five genuine speakers was still false-flagged for review.`},{tone:`t-warn`,value:`35%`,title:`2019-era synthetic speech, caught`,note:`20 samples, FoR dataset. Two of every three older fakes walked straight through.`},{tone:`t-bad`,value:`0%`,title:`Modern neural TTS, caught`,note:`Microsoft Edge Neural voices. Both models called it human — confidently, every single time.`}],verdict:[`A deepfake-accuracy number tells you almost nothing about how a system behaves against tomorrow’s generator. Detection is a useful first filter and a poor last line of defence.`,`So Litmus never asks a detector to be right forever. It asks two independent, differently-biased models to agree — and when they don’t, or when a caller can’t prove something a clone couldn’t fake, the decision goes to a person instead of a guess.`],cite:`Own evaluation, Aug 2026 · FoR (Fake-or-Real) Kaggle dataset · Microsoft Edge Neural TTS`},cr={eyebrow:`Inbound`,heading:`Is the applicant on this video call a real person?`,lead:`Two independently-biased models score every video-KYC frame. Agreement plus confidence clears the case. Disagreement doesn’t guess — it routes to a human.`,points:[{bold:`Disagreement is the signal.`,text:`When one model says fake at 88.9% and the other says real at 99.9%, that gap is information — not an error to average away.`},{bold:`Uncertainty never escalates.`,text:`Only a confident, agreed detection of synthesis reaches the fraud desk. Everything unclear reaches a person.`},{bold:`The bias is published.`,text:`Our first model over-flags South Asian faces. We measured it, disclosed it, and contained it rather than shipping quietly around it.`}]},lr={eyebrow:`Outbound`,heading:`Is the caller claiming to be you actually you?`,lead:`Every identity vendor covers the half where money leaves your institution. The half where your name leaves your building is usually wide open — and that’s where ₹22,495 crore went last year.`,points:[{bold:`The arrow is reversed.`,text:`An OTP makes the customer prove themselves to you — exactly what scams exploit. TrustLine makes you prove yourself to the customer.`},{bold:`It doesn’t rely on detection.`,text:`A perfect voice clone still can’t produce a code it was never issued. That’s why the 0% result above doesn’t sink the system.`},{bold:`Failures become intelligence.`,text:`Every rejected verification names a live campaign — the number, the script, the timing — generated by the attacker, for free.`}]},ur={before:{tag:`Today — the OTP direction`,flow:[`Customer`,`proves identity to`,`Institution`],note:`"Sir, aapka OTP bataiye." The rule never share your OTP fails because it asks a frightened person to refuse a stranger who sounds official.`},after:{tag:`TrustLine — inverted`,flow:[`Institution`,`proves identity to`,`Customer`],note:`"We will always tell you the code. We will never ask you for it." A rule that stays safe even when the customer forgets it.`},code:`SAFFRON-BEACON-47`,codeMeta:`Session-bound · single-use · 10-minute TTL · HMAC-SHA256`,codeNote:`Two words and two digits, not six digits — chosen so the code survives being misheard on a noisy showroom phone call, in any language.`},dr=[{icon:`face`,name:`FaceGuard`,status:`live`,body:`Two independently-biased deepfake models score every video-KYC frame. Disagreement — the expected state for an under-represented face — routes to a person, never to rejection.`,answers:`deepfake customers`},{icon:`voice`,name:`VoicePrint`,status:`live`,body:`A two-model spectral ensemble on any verification call. Its measured ceiling — 0% against modern TTS — is precisely why it’s a first filter and never the final word.`,answers:`cloned voices`},{icon:`shield`,name:`TrustLine`,status:`live`,body:`An HMAC challenge-response that inverts the OTP: the institution proves itself to the customer. A clone can’t produce a code it was never given.`,answers:`AI impersonation attacks`},{icon:`doc`,name:`Identity Forensics`,status:`arch`,body:`Metadata and pixel-level forgery signatures across payslips, bank statements and ID proofs submitted during onboarding.`,answers:`synthetic identities`},{icon:`phone`,name:`CallShield`,status:`arch`,body:`Flags synthetic-speech patterns and scripted call-centre cadence on your own outbound calls, before a TrustLine challenge is even issued.`,answers:`AI-generated voice calls`},{icon:`form`,name:`FormPulse`,status:`arch`,body:`Behavioural biometrics on the application itself — typing cadence, fill speed, copy-paste patterns — to catch bot-filled mass submissions.`,answers:`automated loan applications`}],fr=[{name:`RBI KYC Master Directions`,when:`NOV 2025 · NBFC-SPECIFIC`,body:`Requires V-CIP to carry "face liveness/spoof detection… with a high degree of accuracy," regularly upgraded against emerging fraud. FaceGuard is that control, with a documented evaluation record behind it.`},{name:`RBI FREE-AI Framework`,when:`AUG 2025 · SEVEN SUTRAS`,body:`Fairness, transparency, accountability and explainability for high-risk financial AI. Bias measured and published; uncertainty always routed to a human, never to a rejection.`},{name:`TRAI 1600-series Direction`,when:`NBFCs · FEB–MAR 2026`,body:`Mandates a trusted number range for BFSI calls. It authenticates the number. TrustLine authenticates the human on the line — and survives caller-ID spoofing by construction.`}];function pr(){return(0,M.jsx)(`sectio ,children:[`See what we measured `,(0,M.jsx)(`span`,{className:`arw`,children:`→`})]}),(0,M.jsx)(`a`,{className:`btn btn-ghost`,href:`#modules`,children:`Review the architecture`})]})]})})}var Tr={eyebrow:`Phase 2`,heading:`Stop detecting. Start demanding proof.`,body:`Our own fine-tuned detector reaches 0.934 AUC — good, and still not good enough to decide a loan alone. TrustLine already showed the way out on the outbound side: it never asks whether a voice sounds real, it asks for a code a clone was never issued. Phase 2 applies that same inversion to the inbound side and to fraud that spans institutions. The goal is a pipeline where neither direction depends on a detector being right.`},Er=[{id:`livechallenge`,tag:`Built · live API`,name:`LiveChallenge`,line:`TrustLine, pointed inward.`,problem:`Injection attacks rose roughly 9x in 2024, driven by a 28x spike in virtual-camera exploits. They feed a generated video straight into the verification software, so the camera is never involved and passive liveness never sees a presentation attack at all. No amount of pixel analysis fixes this, because the pixels are perfect.`,idea:`Stop asking "does this face look real?" and start asking "can this face do something it could not have prepared for?" At verification time the server issues a random physical challenge — turn to a stated angle, hold a randomly-coloured card across half your face, mouth a randomly generated word — and checks that the response matches the challenge that was issued.`,why:[`A pre-recorded or pre-generated stream cannot answer a challenge chosen after it was made. Injection attacks fail by construction, not by detection.`,`Real-time face-swap degrades badly under exactly these conditions. The literature is consistent that occlusion, extreme head pose and objects crossing the face are where these models break.`,`It is verifiable rather than probabilistic. The check is "did the response match the issued challenge", which an officer can audit — not a confidence score.`,`We measured it: a fixed pre-generated response cleared 2 sessions in 300, against a theoretical floor of 0.80%. Head pose is derived from landmark geometry, so there is no model to be biased or to drift. An occlusion check was tried and removed — a head turn produces the same landmark asymmetry as a hand over the cheek, so it failed genuine applicants, and the round count was raised instead.`],status:`Built. 23 adversarial tests passing, live on the API.`,built:!0,evidence:[[`Challenge space`,`5 head poses per round`],[`Rounds required`,`3, each derived only after the previous response`],[`Blind-guess probability`,`0.80% (measured: 2 of 300 prepared responses cleared a session)`],[`Head pose`,`Measured geometrically from MTCNN landmarks — no classifier`],[`Session TTL`,`120 seconds`]],source:`Injection-attack figures: industry reporting, 2024–26. Occlusion/pose weakness: ACM TOMM and ICCV 2025 literature.`},{id:`ringgraph`,tag:`Network effect`,name:`RingGraph`,line:`Catch the ring, not the application.`,problem:`75% of auto lenders report rising fraud, and the driver is organised rings rather than lone applicants. They build synthetic profiles in volume, test them against lender systems, and hit several institutions inside the same window before busting out. Each lender sees one plausible application; nobody sees the pattern.`,idea:`Extend the TrustLine Consortium from outbound attackers to inbound rings. Members contribute hashed, bucketed weak signals — device fingerprint, address cluster, employer string, bank-account prefix, dealer code — never raw customer data. A ring shows up as an improbably dense cluster across institutions that no single member could have seen.`,why:[`The same privacy property as TrustLine: the contribution API accepts no identifier that can be reversed to a person, so the guarantee is structural rather than promised.`,`Value compounds with membership. One lender sees its slice; ten lenders see the ring assembling.`,`It catches the profile-building phase, which is weeks before the bust-out and the only point where intervention is cheap.`],status:`Consortium plumbing already exists for outbound. This reuses it.`,source:`Auto-lender fraud survey and bust-out sequence description, Auto Finance News.`},{id:`assettrace`,tag:`After disbursal`,name:`AssetTrace`,line:`The fraud that happens after the loan clears.`,problem:`A Bijnor racket resold loan-funded tractors on forged papers — around ₹53 lakh, uncovered only when finance companies compared complaints. Every control we have runs before disbursal. Nothing watches the asset afterwards, which is where vehicle finance actually bleeds.`,idea:`Periodic asset re-verification: a geotagged photo of the vehicle and its plate at set intervals, checked for tampering, duplication across loan accounts, and inconsistency with the registered chassis. The same forensic stack, pointed at the collateral rather than the customer.`,why:[`Two-wheeler and tractor lending is collateral-backed, and a resold asset is a total loss with no recovery path.`,`Duplicate-asset detection across accounts finds the organised version, where one vehicle backs several loans.`,`It reuses Identity Forensics rather than needing a new model.`],status:`Architecture only. Depends on a field-collection flow that does not exist yet.`,source:`Bijnor tractor-loan resale case, April 2026.`},{id:`formpulse`,tag:`Emerging`,name:`FormPulse`,line:`When the applicant is a script.`,problem:`The whole fraud lifecycle — identity fabrication, document submission, underwriting gaming, disbursement — can now run remotely and be automated end to end. Agentic tooling means the entity filling the form need not be a person at all, and nothing in a document check notices that.`,idea:`Behavioural biometrics on the application itself: keystroke cadence, field-revisit order, paste patterns, time-to-first-keystroke, and how the form is navigated. Humans hesitate, correct themselves and tab backwards. Scripts do not.`,why:[`It is orthogonal to every other signal here — it needs no face, no voice and no document.`,`It costs nothing at capture time; the evidence is a by-product of the applicant filling the form.`,`Bot-filled applications arrive in volume, so one detection protects against a batch.`],status:`Architecture only.`,source:`Digital lending fraud lifecycle analysis, 2026.`}],Dr={heading:`What the architecture looks like when Phase 2 lands`,rows:[{direction:`Inbound — is this applicant real?`,today:`FaceGuard · fine-tuned detector at 0.934 AUC, uncertainty routed to a person`,next:`LiveChallenge · BUILT — a physical challenge the applicant could not have prepared for`,shift:`probabilistic → verifiable`},{direction:`Outbound — is this caller really us?`,today:`TrustLine · HMAC challenge-response, live`,next:`Already verifiable — this is the model Phase 2 copies`,shift:`already done`},{direction:`Across institutions`,today:`Consortium · shared attacker numbers, live`,next:`RingGraph · shared hashed weak signals to surface rings`,shift:`incident → campaign`},{direction:`After disbursal`,today:`Nothing watches the asset`,next:`AssetTrace · periodic collateral re-verification`,shift:`blind → monitored`}]};function Or(){let[e,t]=(0,x.useState)(Er[0].id),n=Er.find(t=>t.id===e)??Er[0];return(0,M.jsx)(`section`,{className:`alt`,id:`next`,children:(0,M.jsxs)(`div`,{className:`wrap`,children:[(0,M.jsxs)(N,{className:`section-head`,children:[(0,M.jsx)(`span`,{className:`eyebrow`,children:Tr.eyebrow}),(0,M.jsx)(`h2`,{children:Tr.heading}),(0,M.jsx)(`p`,{children:Tr.body})]}),(0,M.jsxs)(N,{className:`np-shell`,children:[(0,M.jsx)(`div`,{className:`np-list`,role:`tablist`,children:Er.map(n=>(0,M.jsxs)(`button`,{role:`tab`,"aria-selected":n.id===e,className:`np-item ${n.id===e?`on`:``}`,onClick:()=>t(n.id),children:[(0,M.jsx)(`span`,{className:`np-tag`,children:n.tag}),(0,M.jsx)(`span`,{className:`np-name`,children:n.name}),(0,M.jsx)(`span`,{className:`np-line`,children: hpoints, 190 branches — the scale a scam campaign targets.`,source:`TVS Credit Annual Report FY26`}]},Oi={heading:`The wedge: nobody owns the outbound half.`,body:[`Inbound identity verification is a solved, competitive market. HyperVerge, Signzy, IDfy and Perfios KARZA all sell it, all do it well, and all compete on the same axes — accuracy, latency, document coverage. We do not enter there and do not claim to beat them.`,`The outbound half has no incumbent, and the reason is structural rather than technical. A KYC vendor's contract is with the lender. Protecting the lender's customers from people impersonating that lender creates no billable event for them, so no vendor has built it. The gap persists because of incentives, not difficulty.`,`That is the wedge. TrustLine enters through the half nobody sells, and the fraud intelligence it generates compounds into a defensible network the longer it runs.`]},ki={note:`Indicative pricing for a pilot-stage product. Not a live commercial offer — the numbers exist to show the shape of the model, not to be quoted.`,plans:[{name:`Pilot`,price:`No fee`,period:`90 days`,tagline:`One product line, one branch cluster.`,cta:`Scope a pilot`,featured:!1,features:[`FaceGuard + VoicePrint on a sampled share of V-CIP sessions`,`TrustLine on one outbound campaign`,`Officer console for up to 10 reviewers`,`A written evaluation report — including where we failed`,`No consortium membership`]},{name:`Production`,price:`₹1.40`,period:`per verification`,tagline:`Full pipeline, volume-tiered, billed monthly.`,cta:`Talk to us`,featured:!0,features:[`All three live modules across every channel`,`Fused Litmus Trust Score with full model-level explainability`,`DoT FRI enrichment on every outbound verification`,`TrustLine Consortium membership included`,`Model card, bias audit, and quarterly re-evaluation`,`99.5% uptime target, sub-400ms p95 on the scoring path`]},{name:`Consortium`,price:`Shared`,period:`annual`,tagline:`For an industry body hosting the network.`,cta:`Discuss hosting`,featured:!1,features:[`Hosts the shared fraud feed for member institutions`,`Pseudonymous member attribution`,`Attacker-only records — no customer data crosses members`,`Aggregate campaign reporting to I4C / DoT`,`Per-member coverage analytics`]}],faq:[{q:`Why per-verification rather than per-seat?`,a:`Fraud risk scales with transaction volume, not with headcount. A lender running 40,000 disbursals a month carries more exposure than one running 4,000 with the same number of officers, and the price should track the exposure.`},{q:`What happens when the model routes something to review?`,a:`It still bills as a verification. We deliberately do not price review events differently — charging more when the model is uncertain would create an incentive to make it uncertain more often.`},{q:`Is consortium membership really included?`,a:`Yes, and that is a deliberate commercial choice. The network is worth more to every member as it grows, so putting it behind a separate line item would work against the product.`}]},Ai=[{phase:`Shipped`,when:`Now`,status:`done`,items:[`FaceGuard, VoicePrint and TrustLine live on a working API`,`Disagreement-based fusion with human-in-the-loop routing`,`Measured bias published rather than smoothed out`,`DoT FRI enrichment and consortium signal-sharing`]},{phase:`Next`,when:`1–2 quarters`,status:`active`,items:[`Fine-tune Model 1 on InDeepFake to shrink the manual-review bucket`,`Injection-attack detection — the gap FaceGuard does not currently cover`,`ISO/IEC 30107-3 Level 2 PAD certification path`,`Redis-backed sessions and HSM key custody for TrustLine`]},{phase:`Later`,when:`3–4 quarters`,status:`planned`,items:[`Identity Forensics and FormPulse from architecture into production`,`Live consortium with three or more member institutions`,`Hindi and regional-language voice evaluation set`,`Continuous re-evaluation harness against new generators`]}],ji={note:`Litmus is early. Presenting a large team would be the first dishonest thing on this site.`,people:[{name:`Deepak Meena`,role:`Founder — engineering`,detail:`B.Tech Computer Science, IIIT Delhi. Built the model ensembles, the fusion layer, the TrustLine protocol and this site.`}],hiring:[`ML engineer — multilingual audio anti-spoofing`,`Security engineer — protocol and key custody`,`Design partner — an NBFC willing to run a 90-day pilot`]},Mi=[{title:`Publish the failures`,body:`Our voice ensemble catches 0% of modern neural TTS. That number is on the homepage, in the API response, and in the model card. A fraud vendor that hides its failure modes is selling the problem back to you.`},{title:`Uncertainty is not guilt`,body:`A model that cannot decide routes to a person. It never rejects. Because our first face model over-flags South Asian faces, disagreement is the expected state for a legitimate Indian applicant — treating that as suspicion would turn a known bias into a discriminatory outcome.`},{title:`Design for the model being wrong`,body:`TrustLine does not ask whether a voice sounds real, because we measured that we cannot tell. It asks for a code a clone was never issued. The architecture assumes the detector fails.`},{title:`Share the attacker, never the customer`,body:`Consortium records contain the caller number and nothing else. The contribution API does not accept a customer identifier, so it cannot leak one. The privacy guarantee is the function signature.`}],Ni=[{group:`Inbound — applicant verification`,blurb:`Score a face capture, a voice sample, or both fused into one number.`,endpoints:[{method:`POST`,path:`/api/v1/face/detect`,summary:`Run the two-model face ensemble on one image.`,body:`multipart/form-data — file: image/*`,returns:`verdict, confidence_band, m1_score, m2_score, explanation, action`},{method:`POST`,path:`/api/v1/voice/detect`,summary:`Run the two-model voice ensemble on one audio clip.`,body:`multipart/form-data — file: audio/wav | audio/mpeg`,returns:`verdict, confidence_band, m1_score, m2_score, explanation, action`},{method:`POST`,path:`/api/v1/verify/score`,summary:`Fuse whichever modalities are supplied into one Litmus Trust Score.`,body:`multipart/form-data — face: image/* (optional), voice: audio/* (optional)`,returns:`litmus_trust_score, confidence_band, action, modalities{}, fusion{}, disclosure`}]},{group:`Outbound — TrustLine`,blurb:`Mint an authenticated call, verify one from the customer side, read the fraud feed.`,endpoints:[{method:`POST`,path:`/api/v1/trustline/initiate`,summary:`Mint a session and derive its verification phrase.`,body:`customer_id, customer_phone, agent_id, agent_name, purpose`,returns:`session_id, phrase, agent_script, customer_instruction, expires_at`},{method:`POST`,path:`/api/v1/trustline/verify`,summary:`Customer-side check of an inbound call claiming to be you.`,body:`customer_id, claimed_phrase, caller_number, claimed_purpose`,returns:`result, genuine, severity, message, campaign_alert, fraud_report_id`},{method:`GET`,path:`/api/v1/trustline/fraud-feed`,summary:`Failed verifications, newest first, with FRI and network enrichment.`,body:`—`,returns:`total_reports, critical, high, active_campaigns[], reports[]`}]},{group:`Fraud intelligence`,blurb:`DoT Financial Fraud Risk Indicator enrichment and the TrustLine Consortium.`,endpoints:[{method:`GET`,path:`/api/v1/intel/fri/check/{number}`,summary:`One number's fraud-risk tier from DoT's Digital Intelligence Platform.`,body:`—`,returns:`tier, label, rank, action, guidance, simulated, disclosure`},{method:`GET`,path:`/api/v1/intel/consortium/lookup/{number}`,summary:`What every member institution collectively knows about a number.`,body:`—`,returns:`status, corroborated, distinct_members, reports_in_window, recommendation`},{method:`POST`,path:`/api/v1/intel/consortium/contribute`,summary:`Publish a fraud signal to the network. Accepts no customer identifier.`,body:`member_id, caller_number, severity, claimed_purpose`,returns:`contributed, signal_id, network_view`}]}],Pi={updated:`August 2026`,intro:`Litmus does not train its own detection models. All four are public checkpoints, cited below, combined by a fusion layer we did build. This card records what they do, what they get wrong, and who they get wrong most often.`,models:[{module:`FaceGuard`,slot:`Model 1`,id:`prithivMLmods/Deep-Fake-Detector-Model`,arch:`Vision Transformer`,benchmark:`25% on a FaceForensics++ subset`,note:`Over-flags South Asian faces. Trained on FFHQ, which under-represents them.`},{module:`FaceGuard`,slot:`Model 2`,id:`dima806/deepfake_vs_real_image_detection`,arch:`CNN classifier`,benchmark:`35% on a FaceForensics++ subset`,note:`100% correct on our 15-image Indian face set. No demographic skew observed.`},{module:`VoicePrint`,slot:`Model 1`,id:`MelodyMachine/Deepfake-audio-detection-V2`,arch:`Wav2Vec2 fine-tune`,benchmark:`90% on real speech, 0% on fakes`,note:`Reliable on genuine audio, effectively blind to synthesis.`},{module:`VoicePrint`,slot:`Model 2`,id:`motheecreator/Deepfake-audio-detection`,arch:`Wav2Vec2 base`,benchmark:`80% real, 35% of 2019-era fakes`,note:`Noisier on real speech but the only one that fires on synthesis at all.`}],biases:[{axis:`Ethnicity — South Asian faces`,finding:`Model 1 assigns genuine Indian faces an average real-score of 9.5% on our 15-image test set. In the current ensemble this routes effectively 100% of genuine Indian applicants to manual review.`,impact:`Safe but not fair. Nobody is rejected, but the operational cost of review falls disproportionately on the exact population the deploying lender serves.`,mitigation:`Containment shipped: uncertainty routes to a human, never to rejection. Correction planned: fine-tune on InDeepFake, or weight toward Model 2 for Indian-context inputs.`},{axis:`Gender — female vocal profiles`,finding:`Both voice models misclassify certain female voices as synthetic at roughly a 20% false-positive rate on genuine speech.`,impact:`Real women are disproportionately flagged on verification calls. Ruled out file-format artefacts with a .wav conversion test — the scores did not move.`,mitigation:`A spoof verdict never triggers automatic rejection. Wider demographic audit planned alongside the MLADDC fine-tune.`}],accuracy:{heading:`Calibration — measured, not assumed`,intro:`Model 1 is a good ranker (AUC 0.737) and was a badly calibrated classifier. It scores real images 0.950 and fakes 0.852 — both above the default 0.5 cut, so at that threshold it called almost everything real and landed at 52.5%, which is chance. Recalibrating the cut point, with the threshold chosen on training folds only, lifts held-out accuracy to 70.0%.`,rows:[[`Model 1 AUC (ranking quality)`,`0.737`,`Real signal — the ordering is informative`],[`Model 2 AUC (ranking quality)`,`0.501`,`Coin flip on this benchmark`],[`Equal-weight average AUC`,`0.590`,`Averaging M2 in destroys signal`],[`Accuracy @ default 0.50 cut`,`52.5%`,`Chance`],[`Accuracy @ calibrated 0.975 cut`,`70.0%`,`+17.5 points, cross-validated`]],gates:`Approve above 0.995, escalate below 0.85, human review between. The two errors are not equally costly: auto-approving a synthetic applicant loses the whole loan, while flagging a genuine one costs an officer review. At a symmetric 0.980 cut the system decides 60% of cases but lets 14 fakes through; at these asymmetric gates it decides 25% and lets 2 through. For a lending decision that is the correct trade.`},confound:{heading:`The confound we found by accident`,body:`A real applicant photographed across a room was reported as synthetic. Investigating it produced the most important result in this card. Re-scoring one genuine face at decreasing resolution — the same person, the same photo, only the pixel count changing — gives 0.966 at 400px, 0.926 at 150px, 0.850 at 80px and 0.709 at 48px. The model is measuring capture quality as well as authenticity, and crosses the adverse threshold on a genuine person purely because the crop is small.`,consequence:`Two things follow. First, FaceGuard now refuses to make an adverse finding when the detected face is under 128px, and will not clear one under 160px — a poor capture returns "ask for a closer photo", never "this person is fake". Second, every face in our benchmark set is 45-65px, so the accuracy figures above are themselves partly a measurement of compression rather than synthesis. We report them with that caveat attached rather than quietly enjoying the number.`,why:`RBI V-CIP captures are close-range and sit comfortably above the floor. The public benchmark does not, which is a reason to distrust benchmark-derived accuracy claims in this field generally — including ours.`},scopeCorrection:{heading:`A claim we had to narrow`,body:`Earlier material said "zero silent wrong auto-approvals". That result is real, but it was measured on demo-condition samples. On the harder FF++/DFDC-derived benchmark the same fixed 70% rule auto-decides 41 of 120 cases and is wrong on 17 of them — 41% of the calls it commits to. Both numbers are true; the scope was doing too much work. Recalibrating cut the worst error, fakes auto-approved as real, from 14 to 2. The honest version of the claim is the one stated here.`},limits:[`Voice detection catches 0% of modern neural TTS. Treat VoicePrint as a weak first filter, never as liveness proof.`,`FaceGuard is a deepfake classifier on a captured frame. It is not presentation-attack detection and it does not stop virtual-camera injection, which bypasses the camera entirely.`,`Not ISO/IEC 30107-3 certified. Level 2 is the procurement baseline for biometric onboarding, and the certification path is on the roadmap.`,`Both models can share a blind spot and agree while wrong. Agreement raises confidence; it does not guarantee correctness.`,`All published accuracy figures come from public benchmark data, not from any lender's live capture conditions.`]},Fi=[{version:`3.1`,date:`September 2026`,tag:`current`,changes:[{type:`added`,text:`DoT Financial Fraud Risk Indicator enrichment on every outbound verification, with live and simulated modes clearly distinguished.`},{type:`added`,text:`TrustLine Consortium — cross-lender fraud signal sharing that carries the attacker number and no customer data.`},{type:`added`,text:`Officer console rebuilt inside the React app; marketing site and product now share one design system.`},{type:`added`,text:`Public model card documenting both measured biases in full.`},{type:`added`,text:`Calibrated FaceGuard pipeline: MTCNN face cropping, test-time augmentation over three views, and a cross-validated decision threshold. Held-out accuracy 52.5% -> 70.0%.`},{type:`added`,text:`Asymmetric approve/escalate gates. Fakes auto-approved as real fell from 14 to 2 on the 120-sample benchmark, at the cost of routing more cases to human review.`},{type:`fixed`,text:`Model 2 was an equal voter in face scoring despite scoring AUC 0.501 — averaging it in was measurably destroying signal. It is now a demographic-bias check and does not vote.`},{type:`note`,text:`Narrowed the "zero silent wrong auto-approvals" claim. It holds on demo-condition samples; on the FF++/DFDC benchmark the old rule was wrong on 41% of the cases it committed to. Recalibration is the response.`}]},{version:`3.0`,date:`September 2026`,tag:``,changes:[{type:`added`,text:`TrustLine protocol — HMAC-SHA256 challenge-response, session-bound, single-use, 36 adversarial tests.`},{type:`added`,text:`Fused Litmus Trust Score endpoint combining face and voice.`},{type:`fixed`,text:`Uncertain verdicts were escalating to the fraud desk. Routing bands now resolve from verdict states, so uncertainty always reaches a human instead.`},{type:`fixed`,text:`Every uncertain case returned an identical score because the sub-score was hardcoded to a constant. Now derived continuously from the model evidence.`}]},{version:`2.0`,date:`August 2026`,tag:``,changes:[{type:`added`,text:`VoicePrint two-model ensemble with asymmetric spoof-priority fusion.`},{type:`added`,text:`Disagreement-based routing for FaceGuard.`},{type:`fixed`,text:`Temp-file handling broke on Windows; switched to tempfile.NamedTemporaryFile.`},{type:`note`,text:`Measured 0% detection against modern neural TTS. Published rather than buried — it is why TrustLine exists.`}]}];function Ii({eyebrow:e,title:t,lead:n}){return(0,M.jsx)(`div`,{className:`page-head`,children:(0,M.jsxs)(`div`,{className:`wrap`,children:[(0,M.jsx)(`span`,{className:`eyebrow`,children:e}),(0,M.jsx)(`h1`,{children:t}),n&&(0,M.jsx)(`p`,{children:n})]})})}function Li(){return(0,M.jsxs)(M.Fragment,{children:[(0,M.jsx)(Ii,{eyebrow:`Pricing`,title:`Priced on exposure, not on headcount.`,lead:`Fraud risk scales with how many verifications you run, so that is what you pay for.`}),(0,M.jsx)(`section`,{children:(0,M.jsxs)(`div`,{className:`wrap`,children:[(0,M.jsxs)(`div`,{className:`notice notice-warn wide`,children:[(0,M.jsx)(`b`,{children:`Indicative.`}),` `,ki.note]}),(0,M.jsx)(`div`,{className:`plan-grid`,children:ki.plans.map((e,t)=>(0,M.jsxs)(N,{className:`plan ${e.featured?`plan-featured`:``}`,delay:t*.08,children:[e.featured&&(0,M.jsx)(`div`,{className:`plan-flag`,children:`Most lenders start here`}),(0,M.jsx)(`div`,{className:`plan-name`,children:e.name}),(0,M.jsxs)(`div`,{className:`plan-price`,children:[e.price,` `,(0,M.jsx)(`span`,{className:`plan-period`,children:e.period})]}),(0,M.jsx)(`p`,{className:`plan-tagline`,children:e.tagline}),(0,M.jsx)(`ul`,{className:`plan-features`,children:e.features.map(e=>(0,M.jsx)(`li`,{children:e},e))}),(0,M.jsx)(`a`,{className:`btn ${e.featured?`btn-primary`:`btn-ghost`}`,href:`#/company`,children:e.cta})]},e.name))}),(0,M.jsxs)(`div`,{className:`faq`,children:[(0,M.jsx)(`h2`,{children:`Questions we get asked`}),ki.faq.map(e=>(0,M.jsxs)(N,{className:`faq-item`,children:[(0,M.jsx)(`div`,{className:`faq-q`,children:e.q}),(0,M.jsx)(`p`,{className:`faq-a`,children:e.a})]},e.q))]})]})})]})}function Ri(){return(0,M.jsxs)(M.Fragm
