# Render blueprint for the Litmus backend.
#
# The backend serves the built console at /console from
# frontend/web/dist/index.html, which is committed, so there is no Node build
# step here and the whole thing is same-origin — no CORS, no API discovery.

services:
  - type: web
    name: litmus
    runtime: python
    plan: standard          # ~2 GB RAM. The free 512 MB tier is killed on
                            # startup: torch, tensorflow and MTCNN load at import.
    # The second command downloads the four public checkpoints at BUILD time.
    # Without it transformers fetches them on the first request instead —
    # roughly 1.9 GB over the network while a judge waits, and again after
    # every restart. Failures here are non-fatal: the models still download
    # lazily at runtime, so a HuggingFace outage delays the demo rather than
    # breaking the deploy.
    buildCommand: |
      pip install --upgrade pip
      # CPU-only torch. The default PyPI wheels bundle the NVIDIA CUDA runtime
      # (~2 GB) which is dead weight on a CPU instance and blows the build out
      # on disk and time. Installed first so the pinned versions below are
      # already satisfied and pip does not pull the CUDA build over the top.
      pip install torch==2.2.1 torchvision==0.17.1 --index-url https://download.pytorch.org/whl/cpu
      pip install -r backend/requirements.txt
      python -c "
      import os
      os.environ.setdefault('TF_CPP_MIN_LOG_LEVEL', '3')
      from transformers import pipeline
      for task, name in [
          ('image-classification', 'prithivMLmods/Deep-Fake-Detector-Model'),
          ('image-classification', 'dima806/deepfake_vs_real_image_detection'),
          ('audio-classification', 'MelodyMachine/Deepfake-audio-detection-V2'),
          ('audio-classification', 'motheecreator/Deepfake-audio-detection'),
      ]:
          try:
              pipeline(task, model=name)
              print('cached', name, flush=True)
          except Exception as exc:
              print('WARN could not pre-cache', name, exc, flush=True)
      "
    # --workers 1 is mandatory, not a preference. Sessions live in process
    # memory, so a challenge minted by one worker is invisible to another and
    # LiveChallenge fails about half the time.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --app-dir backend
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Render defaults to a very recent Python (3.14 at time of writing), which
      # has no wheels for the pinned torch. .python-version covers this too;
      # this is the belt-and-braces version that is visible in the dashboard.
      - key: PYTHON_VERSION
        value: 3.11.9
      # Where the pre-downloaded checkpoints live. Set for both build and
      # runtime so the cache written during the build is the one the running
      # service reads.
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      # Comma-separated allowlist of origins permitted to call this API.
      # Set this to your Vercel URL, e.g. https://litmus.vercel.app
      # Unset, it falls back to "*", which keeps /console working same-origin.
      - key: LITMUS_ALLOWED_ORIGINS
        sync: false
      # Signing keys. Each has a development default that is public in this
      # repository — generate real ones or the verification codes are forgeable.
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - key: LITMUS_TRUSTLINE_SECRET
        generateValue: true
      - key: LITMUS_LIVECHALLENGE_SECRET
        generateValue: true
      - key: LITMUS_REPORT_SECRET
        generateValue: true
      - key: LITMUS_CONSORTIUM_SALT
        generateValue: true
      # Email is optional. Without these the record is still generated and the
      # response reports sent:false with a reason — it never claims a delivery
      # it did not make. Set them in the dashboard, never in this file.
      - key: LITMUS_SMTP2GO_API_KEY
        sync: false
      - key: LITMUS_SMTP2GO_SENDER
        sync: false
